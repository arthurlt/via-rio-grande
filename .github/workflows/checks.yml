name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Lint CSS and Markdown
        run: npm run lint

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install gotmplfmt
        run: go install github.com/gohugoio/gotmplfmt@v0.4.1

      - name: Check Go template formatting
        run: diff <(gotmplfmt -d layouts) <(printf '')

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.162.1"
          extended: true

      - name: Validate site
        run: python3 scripts/validate_site.py
