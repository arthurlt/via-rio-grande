{{ define "main" }}
<article class="w-100 ph3 ph5-ns pv5 center mw9 {{ $.Param "text_color" | default "mid-gray" }}">

  <header class="mb5">
    <h2 class="f2 lh-title mb3 mt0 pt3 bt bw2 ttu blue">
      <span class="fw9">{{ $.Param "header_accent" }}</span>
      <span class="fw4">{{ $.Param "header_main" }}</span>
    </h2>
  </header>

  <section class="w-100 w-75-l center">
    {{ .Content }}
  </section>

</article>
{{ end }}
