{{/* Shared page shell. Dict: content (HTML string), optional after (HTML string), optional text_color. */}}
{{- $textColor := .text_color | default "mid-gray" -}}
<article class="w-100 ph3 ph5-ns pv4 pv5-ns center mw9 {{ $textColor }}">
  <div class="w-100 site-prose nested-copy-line-height nested-links">
    {{ .content | safeHTML }}
  </div>
  {{- with .after -}}
    <div class="w-100 mt4">
      {{ . | safeHTML }}
    </div>
  {{- end -}}
</article>
