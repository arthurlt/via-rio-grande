{{/* Shared page shell. Dict: content (HTML string), optional after (HTML string), optional text_color. */}}
{{- $textColor := .text_color | default "mid-gray" -}}
<article class="center mw9 ph3 ph5-ns pv4 pv5-ns w-100 {{ $textColor }}">
	<div class="center mw7 w-100 nested-copy-line-height nested-links">
		{{ .content | safeHTML }}
	</div>
	{{- with .after -}}
		<div class="mt4 w-100">
			{{ . | safeHTML }}
		</div>
	{{- end -}}
</article>
