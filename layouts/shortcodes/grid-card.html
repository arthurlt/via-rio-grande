<div class="flex flex-column ph3 pv3 w-100 w-50-l w-50-m">
	<div class="flex flex-auto flex-column justify-between b--black-10 ba bg-near-white br3 pa4">
		<div>
			<h3 class="mb2 mt0 f3 lh-title">{{ .Get "title" }}</h3>
			<div class="f5 lh-copy mid-gray">{{ .Inner | markdownify }}</div>
		</div>
		<a href="{{ .Get "url" }}" class="db bg-blue br2 hover-bg-dark-blue mt3 ph4 pv3 w-100 f5 fw6 lh-title no-underline tc white"{{ if strings.HasPrefix (.Get "url") "http" }} rel="noopener noreferrer" target="_blank"{{ end }}>
			{{ .Get "button" }}
		</a>
	</div>
</div>
